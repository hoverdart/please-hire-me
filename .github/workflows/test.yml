name: Local invariants
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: local-invariants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit==2.10.1
      # The suite verifies that the development lock includes every runtime pin.
      - run: python -m pip_audit -r requirements/development.lock --disable-pip --no-deps
  test:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.14'
          - os: macos-14
            python: '3.12'
          - os: ubuntu-24.04-arm
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements/development.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - run: python -m compileall -q hireme scripts tests
      - run: for file in hireme/static/*.js; do node --check "$file" || exit; done
      - run: for file in run.sh setup.sh scripts/*.sh; do bash -n "$file"; done
      - run: python -m pip install build
      - run: python -m build
      - name: Build versioned source archive
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          git archive --format=tar.gz --prefix="please-hire-me-$version/" -o "dist/please-hire-me-$version-source.tar.gz" HEAD
      - run: python scripts/check_release_artifacts.py dist/*
      - run: python scripts/check_install_artifact.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: verified-distributions-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
