name: Local invariants
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.14'
          - os: macos-14
            python: '3.12'
          - os: ubuntu-24.04-arm
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements/development.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - run: node --check hireme/static/app.js
      - run: for file in run.sh setup.sh scripts/*.sh; do bash -n "$file"; done
      - run: python -m pip install build
      - run: python -m build
      - name: Build versioned source archive
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          git archive --format=tar.gz --prefix="please-hire-me-$version/" -o "dist/please-hire-me-$version-source.tar.gz" HEAD
      - run: python scripts/check_install_artifact.py dist/*.whl
      - run: python scripts/check_release_artifacts.py dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: verified-distributions-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
