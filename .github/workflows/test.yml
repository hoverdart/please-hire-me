name: Local invariants
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-invariants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit==2.10.1
      # The suite verifies that the development lock includes every runtime pin.
      - run: python -m pip_audit -r requirements/development.lock --disable-pip --no-deps
  test:
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.14'
          - os: macos-15-intel
            python: '3.12'
          - os: ubuntu-24.04-arm
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements/development.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m playwright install --with-deps chromium
      - name: Install age for encrypted backup verification (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Install age for encrypted backup verification (macOS)
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install age
      - name: Check macOS workspace interactions first
        if: runner.os == 'macOS'
        run: python scripts/run_ci_tests.py --timeout-seconds 300 tests/test_basic_context_ui.py tests/test_connected_workspace_ui.py
      - run: python scripts/run_ci_tests.py
      - name: Retain synthetic dashboard failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-failure-${{ matrix.os }}-python-${{ matrix.python }}
          path: test-results/dashboard/
          if-no-files-found: ignore
          retention-days: 7
      - run: python -m compileall -q hireme scripts tests
      - run: for file in hireme/static/*.js; do node --check "$file" || exit; done
      - run: for file in run.sh setup.sh scripts/*.sh; do bash -n "$file"; done
      - run: python -m pip install build
      - run: python -m build
      - name: Build versioned source archive
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          git archive --format=tar.gz --prefix="please-hire-me-$version/" -o "dist/please-hire-me-$version-source.tar.gz" HEAD
      - run: python scripts/check_release_artifacts.py dist/*
      - run: python scripts/check_install_artifact.py dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-distributions-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
